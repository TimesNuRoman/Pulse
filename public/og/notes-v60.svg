<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Pulse Notes v0.6.0 Greenfield — Android markdown editor. Pulse, AI that doesn't get to leave the room.">
