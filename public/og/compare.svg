      <rect x="0" y="0" width="120" height="48" rx="24" fill="rgba(36,40,59,0.7)" stroke="rgba(187,154,247,0.4)"/>
      <text x="60" y="30" font-family="ui-sans-serif, system-ui" font-size="16" fill="#c0caf5" font-weight="600" text-anchor="middle">LM Studio</text>
    </g>
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="110" height="48" rx="24" fill="rgba(36,40,59,0.7)" stroke="rgba(187,154,247,0.4)"/>
      <text x="55" y="30" font-family="ui-sans-serif, system-ui" font-size="16" fill="#c0caf5" font-weight="600" text-anchor="middle">Ollama</text>
