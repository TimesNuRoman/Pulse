  <text x="80" y="356" font-family="ui-sans-serif, system-ui" font-size="54" fill="#c0caf5" font-weight="600" letter-spacing="-0.025em">respects your time</text>
  <text x="80" y="422" font-family="ui-sans-serif, system-ui" font-size="54" fill="#c0caf5" font-weight="600" letter-spacing="-0.025em">and privacy.</text>

