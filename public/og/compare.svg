  <!-- Bottom meta -->
  <text x="80" y="600" font-family="ui-sans-serif, system-ui" font-size="13" fill="#565f89" font-weight="500">Apache 2.0 - 0 emoji - 0 marketing fluff - updated 2026-08-01</text>
</svg>
