<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Notes that remember. Pulse Notes v0.5.2.">
  <title>Notes that remember. Pulse Notes v0.5.2.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16171f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb9af7"/>
      <stop offset="0.5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Pulse logo -->
  <g transform="translate(80, 80)">
    <circle cx="32" cy="32" r="14" fill="none" stroke="#bb9af7" stroke-width="1.5" opacity="0.7"/>
    <circle cx="32" cy="32" r="14" fill="none" stroke="#bb9af7" stroke-width="1.5" opacity="0.4"/>
    <circle cx="32" cy="32" r="9" fill="#bb9af7"/>
    <circle cx="35" cy="30" r="2" fill="#1a1b26"/>
  </g>
  <text x="160" y="118" fill="#c0caf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Pulse</text>
  <text x="252" y="118" fill="#8aa1c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">· Notes</text>

  <!-- Headline -->
  <text x="80" y="260" fill="url(#text)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-0.025em">Notes that remember.</text>
  <text x="80" y="350" fill="#9aa5ce" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500">CodeMirror 6 editor. Split-pane preview. [[wikilink]] backlinks.</text>
  <text x="80" y="388" fill="#9aa5ce" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500">Tag autocomplete. Material 3 toolbar. Local-first.</text>

  <!-- Feature chips -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="rgba(187,154,247,0.10)" stroke="rgba(187,154,247,0.4)"/>
    <text x="70" y="24" text-anchor="middle" fill="#bb9af7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">CodeMirror 6</text>

    <rect x="152" y="0" width="100" height="36" rx="18" fill="rgba(122,162,247,0.10)" stroke="rgba(122,162,247,0.4)"/>
    <text x="202" y="24" text-anchor="middle" fill="#7aa2f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Split-pane</text>

    <rect x="264" y="0" width="120" height="36" rx="18" fill="rgba(224,175,104,0.10)" stroke="rgba(224,175,104,0.4)"/>
    <text x="324" y="24" text-anchor="middle" fill="#e0af68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">[[wikilinks]]</text>

    <rect x="396" y="0" width="140" height="36" rx="18" fill="rgba(173,142,230,0.10)" stroke="rgba(173,142,230,0.4)"/>
    <text x="466" y="24" text-anchor="middle" fill="#ad8ee6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Tag autocomplete</text>

    <rect x="548" y="0" width="100" height="36" rx="18" fill="rgba(158,206,106,0.10)" stroke="rgba(158,206,106,0.4)"/>
    <text x="598" y="24" text-anchor="middle" fill="#9ece6a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">M3 toolbar</text>
  </g>

  <!-- Bottom bar -->
  <rect x="80" y="540" width="1040" height="50" rx="10" fill="rgba(36,40,59,0.55)" stroke="rgba(47,51,77,0.7)"/>
  <text x="100" y="572" fill="#c0caf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">v0.5.2</text>
  <text x="160" y="572" fill="#8aa1c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">· Windows + Android · Apache 2.0</text>
  <text x="1100" y="572" text-anchor="end" fill="#bb9af7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">pulse.local/notes.html</text>
</svg>
