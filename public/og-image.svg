<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Pulse — AI that doesn't get to leave the room. Local. Private. 12MB.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16171f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <circle cx="44" cy="44" r="22" fill="none" stroke="#bb9af7" stroke-width="3" opacity="0.9"/>
    <circle cx="44" cy="44" r="22" fill="none" stroke="#bb9af7" stroke-width="3" opacity="0.6"/>
    <circle cx="44" cy="44" r="22" fill="none" stroke="#bb9af7" stroke-width="3" opacity="0.3"/>
    <circle cx="44" cy="44" r="14" fill="#bb9af7"/>
    <circle cx="49" cy="41" r="3" fill="#1a1b26"/>
    <text x="100" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="#c0caf5" letter-spacing="2">PULSE</text>
  </g>

  <!-- Title -->
  <text x="80" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="86" font-weight="800" fill="#c0caf5" letter-spacing="-2">AI that</text>
  <text x="80" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="86" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">doesn't get to leave</text>
  <text x="80" y="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="86" font-weight="800" fill="#c0caf5" letter-spacing="-2">the room.</text>

  <!-- Subtitle -->
  <text x="80" y="560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500" fill="#9aa5ce">Local. Private. 12MB. That's not a feature list, that's a stand.</text>

  <!-- Footer chip -->
  <g transform="translate(900, 540)">
    <rect x="0" y="0" width="220" height="50" rx="25" fill="none" stroke="#2f334d" stroke-width="2"/>
    <text x="110" y="32" font-family="ui-monospace, monospace" font-size="20" font-weight="600" fill="#7dcfff" text-anchor="middle">v0.3.0 · Windows</text>
  </g>
</svg>
