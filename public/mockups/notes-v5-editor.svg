<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Pulse Notes v0.5.2 — CodeMirror 6 markdown editor with split-pane preview">
  <title>Pulse Notes v0.5.2 — CodeMirror 6 markdown editor with split-pane preview</title>
  <defs>
    <!-- Tokyo Night palette -->
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frameBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4261"/>
      <stop offset="1" stop-color="#2f334d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .frame-bg    { fill: #0d0e14; }
      .titlebar    { fill: #24283b; }
      .body-bg     { fill: #1a1b26; }
      .border      { stroke: #2f334d; stroke-width: 1; fill: none; }
      .border-faint{ stroke: #2f334d; stroke-width: 1; fill: none; opacity: 0.5; }
      .linenum     { fill: #565f89; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .editor-text { fill: #c0caf5; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .editor-mute { fill: #9aa5ce; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .h1          { fill: #bb9af7; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; font-weight: 700; }
      .h2          { fill: #7aa2f7; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; font-weight: 700; }
      .code        { fill: #9ece6a; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .link        { fill: #7dcfff; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .wikilink    { fill: #e0af68; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; font-weight: 600; }
      .tag         { fill: #ad8ee6; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .preview-h1  { fill: #c0caf5; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 26px; font-weight: 600; }
      .preview-h2  { fill: #c0caf5; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 600; }
      .preview-p   { fill: #9aa5ce; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
      .preview-em  { fill: #c0caf5; font-style: italic; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
      .preview-a   { fill: #7aa2f7; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; text-decoration: underline; }
      .preview-cb  { fill: #1a1b26; stroke: #2f334d; }
      .preview-cb-text { fill: #9ece6a; font-family: ui-monospace, monospace; font-size: 12px; }
      .toolbar-btn { fill: #2a2f45; stroke: #3b4261; }
      .toolbar-tx  { fill: #9aa5ce; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; }
      .cursor      { fill: #bb9af7; }
      .divider     { fill: #2f334d; }
      .divider-grip { fill: #565f89; }
      .tag-chip    { fill: rgba(125,207,255,0.10); stroke: rgba(125,207,255,0.4); }
      .tag-tx      { fill: #7dcfff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 500; }
      .save-btn    { fill: #bb9af7; }
      .save-tx     { fill: #1a1b26; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; }
      .pill        { fill: rgba(187,154,247,0.10); stroke: rgba(187,154,247,0.4); }
      .pill-tx     { fill: #bb9af7; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 600; }
      .pill-dot    { fill: #9ece6a; }
    </style>
  </defs>

  <!-- Halo glow behind frame -->
  <rect x="40" y="40" width="1120" height="720" rx="20" fill="url(#halo)"/>

  <!-- Window frame -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="1080" height="680" rx="14" class="frame-bg" stroke="url(#frameBorder)"/>

    <!-- Title bar -->
    <rect x="60" y="60" width="1080" height="44" rx="14" class="titlebar"/>
    <rect x="60" y="92" width="1080" height="12" class="titlebar"/>
    <line x1="60" y1="104" x2="1140" y2="104" class="border"/>
    <!-- Traffic lights -->
    <circle cx="84" cy="82" r="6" fill="#f7768e"/>
    <circle cx="106" cy="82" r="6" fill="#e0af68"/>
    <circle cx="128" cy="82" r="6" fill="#9ece6a"/>
    <!-- Title -->
    <text x="160" y="86" class="editor-mute" font-size="12">Pulse Notes — Bangkok trip planning.md</text>
    <!-- Version pill -->
    <rect x="1024" y="71" width="92" height="22" rx="11" class="pill"/>
    <circle cx="1038" cy="82" r="3.5" class="pill-dot"/>
    <text x="1048" y="86" class="pill-tx">v0.5.2</text>

    <!-- M3 Toolbar -->
    <rect x="60" y="105" width="1080" height="44" class="body-bg"/>
    <line x1="60" y1="149" x2="1140" y2="149" class="border"/>
    <g transform="translate(80, 113)">
      <!-- B -->
      <rect x="0" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <text x="16" y="20" text-anchor="middle" class="toolbar-tx" font-weight="700">B</text>
      <!-- I -->
      <rect x="40" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <text x="56" y="20" text-anchor="middle" class="toolbar-tx" font-style="italic" font-weight="700">I</text>
      <!-- </> code -->
      <rect x="80" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <text x="96" y="20" text-anchor="middle" class="toolbar-tx" font-family="ui-monospace, monospace">&lt;/&gt;</text>
      <!-- link -->
      <rect x="120" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <g transform="translate(132, 8)" stroke="#9aa5ce" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M2,8 L4,2 L10,2 L12,8 L10,14 L4,14 Z"/>
        <line x1="6" y1="8" x2="10" y2="8"/>
      </g>
      <!-- list -->
      <rect x="160" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <g transform="translate(168, 7)" fill="#9aa5ce">
        <circle cx="2" cy="2" r="1.5"/>
        <circle cx="2" cy="8" r="1.5"/>
        <circle cx="2" cy="14" r="1.5"/>
        <rect x="7" y="0.5" width="11" height="3" rx="1"/>
        <rect x="7" y="6.5" width="11" height="3" rx="1"/>
        <rect x="7" y="12.5" width="11" height="3" rx="1"/>
      </g>
      <!-- H1 -->
      <rect x="200" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <text x="216" y="20" text-anchor="middle" class="toolbar-tx">H1</text>
      <!-- H2 -->
      <rect x="240" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <text x="256" y="20" text-anchor="middle" class="toolbar-tx">H2</text>
      <!-- H3 -->
      <rect x="280" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <text x="296" y="20" text-anchor="middle" class="toolbar-tx">H3</text>
      <!-- image -->
      <rect x="320" y="0" width="32" height="28" rx="6" class="toolbar-btn"/>
      <g transform="translate(328, 8)" stroke="#9aa5ce" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="16" height="12" rx="1.5"/>
        <circle cx="5" cy="4" r="1.5"/>
        <path d="M0,9 L5,6 L9,9 L13,5 L16,8"/>
      </g>
    </g>

    <!-- Pane split: editor on left (50%), preview on right (50%) -->
    <!-- Editor pane -->
    <rect x="60" y="150" width="540" height="540" class="body-bg"/>
    <!-- Line numbers gutter -->
    <rect x="60" y="150" width="44" height="540" fill="#16171f"/>
    <line x1="104" y1="150" x2="104" y2="690" class="border-faint"/>
    <!-- Editor content -->
    <g transform="translate(120, 174)">
      <text class="h1" x="0" y="0"># Bangkok trip planning</text>
      <text class="linenum" x="-50" y="0">1</text>
      <text class="editor-mute" x="0" y="22">Last updated: 2026-07-31</text>
      <text class="linenum" x="-50" y="22">2</text>
      <text x="0" y="22"> </text>
      <text class="h2" x="0" y="56">## Hotels to consider</text>
      <text class="linenum" x="-50" y="56">3</text>
      <text class="editor-text" x="0" y="80">- <tspan class="wikilink">[[Bangkok hotel options]]</tspan> —</text>
      <text class="linenum" x="-50" y="80">4</text>
      <text class="editor-text" x="0" y="102">  three places in Sukhumvit,</text>
      <text class="linenum" x="-50" y="102">5</text>
      <text class="editor-text" x="0" y="124">  <tspan class="link">[booking link]</tspan>(airbnb).</text>
      <text class="linenum" x="-50" y="124">6</text>
      <text class="editor-text" x="0" y="146">- <tspan class="wikilink">[[Capsule hotel Osaka]]</tspan></text>
      <text class="linenum" x="-50" y="146">7</text>
      <text class="editor-text" x="0" y="168">  (for the *one night* in KIX).</text>
      <text class="linenum" x="-50" y="168">8</text>
      <text x="0" y="190"> </text>
      <text class="linenum" x="-50" y="190">9</text>
      <text class="h2" x="0" y="212">## Visa checklist</text>
      <text class="linenum" x="-50" y="212">10</text>
      <text class="editor-text" x="0" y="236">Run the check on</text>
      <text class="linenum" x="-50" y="236">11</text>
      <text class="code" x="0" y="258">    thai-evisa.go.th</text>
      <text class="linenum" x="-50" y="258">12</text>
      <text class="editor-text" x="0" y="280">at least 30 days before.</text>
      <text class="linenum" x="-50" y="280">13</text>
      <text x="0" y="302"> </text>
      <text class="linenum" x="-50" y="302">14</text>
      <text class="editor-text" x="0" y="324">Tags: <tspan class="tag">#travel</tspan> <tspan class="tag">#bangkok</tspan></text>
      <text class="linenum" x="-50" y="324">15</text>
      <text class="editor-text" x="0" y="346">      <tspan class="tag">#october</tspan> <tspan class="tag">#visa</tspan></text>
      <text class="linenum" x="-50" y="346">16</text>
      <text x="0" y="368"> </text>
      <text class="linenum" x="-50" y="368">17</text>
      <!-- Cursor (blinking) -->
      <rect x="100" y="356" width="2" height="18" class="cursor"/>
    </g>

    <!-- Pane divider -->
    <rect x="600" y="150" width="2" height="540" class="divider"/>
    <rect x="595" y="408" width="12" height="24" rx="3" class="divider-grip"/>

    <!-- Preview pane -->
    <rect x="602" y="150" width="538" height="540" fill="#16171f"/>
    <g transform="translate(622, 174)">
      <text class="preview-h1" x="0" y="0">Bangkok trip planning</text>
      <line x1="0" y1="20" x2="500" y2="20" stroke="#2f334d" stroke-width="0.5"/>
      <text class="preview-p" x="0" y="42" font-style="italic" fill="#565f89">Last updated: 2026-07-31</text>

      <text class="preview-h2" x="0" y="76">Hotels to consider</text>
      <text class="preview-p" x="0" y="98">• <tspan fill="#e0af68" font-weight="600">[[Bangkok hotel options]]</tspan> — three</text>
      <text class="preview-p" x="14" y="118">places in Sukhumvit, <tspan class="preview-a">[booking link]</tspan></text>
      <text class="preview-p" x="0" y="140">• <tspan fill="#e0af68" font-weight="600">[[Capsule hotel Osaka]]</tspan> (for the</text>
      <text class="preview-p" x="14" y="160"><tspan class="preview-em">one night</tspan> in KIX).</text>

      <text class="preview-h2" x="0" y="200">Visa checklist</text>
      <text class="preview-p" x="0" y="222">Run the check on</text>
      <rect x="0" y="232" width="320" height="22" class="preview-cb" rx="4"/>
      <text class="preview-cb-text" x="8" y="248">thai-evisa.go.th</text>
      <text class="preview-p" x="0" y="276">at least 30 days before.</text>

      <text class="preview-p" x="0" y="316" fill="#565f89" font-size="11">Tags:</text>
      <g transform="translate(40, 304)">
        <rect x="0" y="0" width="50" height="20" rx="10" class="tag-chip"/>
        <text x="25" y="14" text-anchor="middle" class="tag-tx">#travel</text>
        <rect x="56" y="0" width="62" height="20" rx="10" class="tag-chip"/>
        <text x="87" y="14" text-anchor="middle" class="tag-tx">#bangkok</text>
        <rect x="124" y="0" width="58" height="20" rx="10" class="tag-chip"/>
        <text x="153" y="14" text-anchor="middle" class="tag-tx">#october</text>
        <rect x="188" y="0" width="46" height="20" rx="10" class="tag-chip"/>
        <text x="211" y="14" text-anchor="middle" class="tag-tx">#visa</text>
      </g>
    </g>

    <!-- Status bar -->
    <rect x="60" y="690" width="1080" height="50" fill="#16171f"/>
    <line x1="60" y1="690" x2="1140" y2="690" class="border"/>
    <text x="80" y="720" class="editor-mute" font-size="11">Ln 17, Col 18 · Markdown · UTF-8</text>
    <text x="380" y="720" class="editor-mute" font-size="11">•</text>
    <text x="400" y="720" class="editor-mute" font-size="11">17 lines · 642 chars</text>
    <text x="560" y="720" class="editor-mute" font-size="11">•</text>
    <text x="580" y="720" class="editor-mute" font-size="11">2 wikilinks · 4 tags</text>
    <!-- Save button -->
    <rect x="1040" y="700" width="80" height="30" rx="15" class="save-btn"/>
    <text x="1080" y="720" text-anchor="middle" class="save-tx">Save</text>
  </g>
</svg>
