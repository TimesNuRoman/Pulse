<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Pulse Notes v0.6.0 Android editor with split-pane preview">
  <title>Pulse Notes v0.6.0 — Android editor with split-pane</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16171f"/>
    </linearGradient>
    <linearGradient id="phone-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#1f2233"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb9af7"/>
      <stop offset="0.5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="720" height="520" fill="url(#bg)"/>
  <rect width="720" height="520" fill="#bb9af7" opacity="0.04" filter="url(#soft)"/>

  <!-- Android phone frame (rotated slightly for editorial feel) -->
  <g transform="translate(190, 30) rotate(-3 170 230)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="340" height="460" rx="36" fill="url(#phone-frame)" stroke="#3b4261" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="10" y="10" width="320" height="440" rx="28" fill="#1a1b26"/>
    <!-- Status bar -->
    <rect x="10" y="10" width="320" height="28" fill="#1a1b26"/>
    <text x="28" y="29" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9aa5ce" font-weight="500">9:41</text>
    <circle cx="290" cy="24" r="3" fill="#9ece6a"/>
    <text x="298" y="29" font-family="ui-sans-serif, system-ui" font-size="9" fill="#9aa5ce">●</text>

    <!-- M3 Top app bar -->
    <rect x="10" y="38" width="320" height="48" fill="#1f2233"/>
    <text x="32" y="68" font-family="ui-sans-serif, system-ui" font-size="14" fill="#c0caf5" font-weight="500">Bangkok trip · Oct</text>
    <circle cx="305" cy="62" r="10" fill="#24283b" stroke="#3b4261"/>
    <polyline points="301,63 304,66 309,60" fill="none" stroke="#bb9af7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Split-pane: editor (left) + preview (right) -->
    <g transform="translate(10, 86)">
      <!-- Editor pane -->
      <rect x="0" y="0" width="200" height="320" fill="#1a1b26"/>
      <text x="8" y="20" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">1</text>
      <text x="8" y="40" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">2</text>
      <text x="8" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">3</text>
      <text x="8" y="80" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">4</text>
      <text x="8" y="100" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">5</text>
      <text x="8" y="120" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">6</text>
      <text x="8" y="140" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">7</text>
      <text x="8" y="160" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">8</text>
      <text x="8" y="180" font-family="ui-monospace, monospace" font-size="9" fill="#565f89">9</text>
      <text x="20" y="20" font-family="ui-sans-serif, system-ui" font-size="10" fill="#bb9af7" font-weight="600"># Bangkok, day 3</text>
      <text x="20" y="40" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9aa5ce">Hotel near BTS, ~1200</text>
      <text x="20" y="56" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9aa5ce">THB/night, pool, breakfast.</text>
      <text x="20" y="80" font-family="ui-sans-serif, system-ui" font-size="10" fill="#e0af68" font-weight="600">## Tips from Sasha</text>
      <text x="20" y="100" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9aa5ce">- Take the airport rail, not</text>
      <text x="20" y="116" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9aa5ce">  a taxi from BKK.</text>
      <text x="20" y="136" font-family="ui-sans-serif, system-ui" font-size="10" fill="#e0af68" font-weight="600">## [[</text>
      <text x="56" y="136" font-family="ui-sans-serif, system-ui" font-size="10" fill="#7dcfff" font-weight="600">Sasha-Bangkok</text>
      <rect x="56" y="124" width="118" height="14" fill="none" stroke="#7aa2f7" stroke-width="1" opacity="0.6" rx="2"/>
      <text x="20" y="160" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9aa5ce">Tags: </text>
      <text x="56" y="160" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9ece6a">#travel</text>
      <text x="92" y="160" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9ece6a">#bkk</text>
      <text x="122" y="160" font-family="ui-sans-serif, system-ui" font-size="10" fill="#9ece6a">#oct</text>
      <text x="20" y="180" font-family="ui-sans-serif, system-ui" font-size="10" fill="#bb9af7" font-weight="500">— Roman, Aug 1</text>

      <!-- Drag divider -->
      <rect x="198" y="0" width="4" height="320" fill="#bb9af7" opacity="0.6"/>
      <circle cx="200" cy="160" r="6" fill="#1a1b26" stroke="#bb9af7" stroke-width="2"/>
      <line x1="200" y1="155" x2="200" y2="165" stroke="#bb9af7" stroke-width="1.5"/>
      <line x1="195" y1="160" x2="205" y2="160" stroke="#bb9af7" stroke-width="1.5"/>

      <!-- Preview pane -->
      <rect x="202" y="0" width="118" height="320" fill="#1f2233"/>
      <text x="210" y="20" font-family="ui-sans-serif, system-ui" font-size="10" fill="#bb9af7" font-weight="700">Bangkok, day 3</text>
      <text x="210" y="32" font-family="ui-sans-serif, system-ui" font-size="7" fill="#9aa5ce">─────────────────</text>
      <text x="210" y="48" font-family="ui-sans-serif, system-ui" font-size="8" fill="#c0caf5">Hotel near BTS,</text>
      <text x="210" y="60" font-family="ui-sans-serif, system-ui" font-size="8" fill="#c0caf5">~1200 THB/night,</text>
      <text x="210" y="72" font-family="ui-sans-serif, system-ui" font-size="8" fill="#c0caf5">pool, breakfast.</text>
      <text x="210" y="92" font-family="ui-sans-serif, system-ui" font-size="9" fill="#e0af68" font-weight="600">Tips from Sasha</text>
      <text x="210" y="108" font-family="ui-sans-serif, system-ui" font-size="8" fill="#c0caf5">• Take the airport</text>
      <text x="210" y="120" font-family="ui-sans-serif, system-ui" font-size="8" fill="#c0caf5">  rail, not a taxi</text>
      <text x="210" y="132" font-family="ui-sans-serif, system-ui" font-size="8" fill="#c0caf5">  from BKK.</text>
      <text x="210" y="152" font-family="ui-sans-serif, system-ui" font-size="8" fill="#7aa2f7" text-decoration="underline">→ Sasha-Bangkok</text>
      <text x="210" y="170" font-family="ui-sans-serif, system-ui" font-size="7" fill="#9ece6a">#travel #bkk #oct</text>
    </g>

    <!-- M3 toolbar at bottom -->
    <rect x="10" y="406" width="320" height="44" fill="#1f2233"/>
    <rect x="10" y="406" width="320" height="2" fill="url(#hl)" opacity="0.4"/>
    <g font-family="ui-sans-serif, system-ui" font-size="11" font-weight="600" fill="#c0caf5">
      <text x="32" y="432">B</text>
      <text x="62" y="432" font-style="italic">I</text>
      <text x="92" y="432" font-family="ui-monospace, monospace" font-size="9">{}</text>
      <text x="124" y="432">≡</text>
      <text x="156" y="432">H1</text>
      <g transform="translate(184, 422)">
        <rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="#c0caf5" stroke-width="1.5"/>
        <line x1="5" y1="8" x2="11" y2="8" stroke="#c0caf5" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="8" y1="5" x2="8" y2="11" stroke="#c0caf5" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="220" y="432">+</text>
    </g>
    <rect x="276" y="416" width="36" height="24" rx="12" fill="#bb9af7"/>
    <text x="285" y="432" font-family="ui-sans-serif, system-ui" font-size="9" fill="#1a1b26" font-weight="700">SAVE</text>

    <!-- Home indicator -->
    <rect x="135" y="446" width="70" height="3" rx="1.5" fill="#9aa5ce" opacity="0.5"/>
  </g>

  <!-- Right-side label: phone bezel for v0.6.0 -->
  <g transform="translate(540, 120)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" fill="#bb9af7" font-weight="600" letter-spacing="0.1em">v0.6.0 · ANDROID</text>
    <line x1="0" y1="10" x2="60" y2="10" stroke="#bb9af7" stroke-width="1.5"/>
    <text x="0" y="38" font-family="ui-sans-serif, system-ui" font-size="13" fill="#c0caf5" font-weight="500">CodeMirror 6</text>
    <text x="0" y="58" font-family="ui-sans-serif, system-ui" font-size="13" fill="#c0caf5" font-weight="500">split-pane</text>
    <text x="0" y="78" font-family="ui-sans-serif, system-ui" font-size="13" fill="#c0caf5" font-weight="500">[[wikilink]]</text>
    <text x="0" y="98" font-family="ui-sans-serif, system-ui" font-size="13" fill="#c0caf5" font-weight="500">#tag</text>
    <text x="0" y="118" font-family="ui-sans-serif, system-ui" font-size="13" fill="#c0caf5" font-weight="500">M3 toolbar</text>
    <text x="0" y="138" font-family="ui-sans-serif, system-ui" font-size="13" fill="#c0caf5" font-weight="500">9 Capacitor plugins</text>
    <text x="0" y="158" font-family="ui-sans-serif, system-ui" font-size="13" fill="#c0caf5" font-weight="500">150/150 vitest</text>
    <text x="0" y="184" font-family="ui-monospace, monospace" font-size="10" fill="#565f89">4.32MB APK</text>
    <text x="0" y="200" font-family="ui-monospace, monospace" font-size="10" fill="#565f89">versionCode 10</text>
    <text x="0" y="216" font-family="ui-monospace, monospace" font-size="10" fill="#565f89">minSdk 24 · targetSdk 36</text>
  </g>

  <!-- Left side small caption -->
  <g transform="translate(40, 460)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10" fill="#565f89" letter-spacing="0.05em">SVELTE 5 · TS STRICT · VITE</text>
    <text x="0" y="14" font-family="ui-monospace, monospace" font-size="10" fill="#565f89" letter-spacing="0.05em">GREENFIELD, NOT A PORT</text>
  </g>
</svg>
