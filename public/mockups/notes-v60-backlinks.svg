  <text x="80" y="100" font-family="ui-sans-serif, system-ui" font-size="15" fill="#bb9af7" font-weight="700"># Bangkok, October trip</text>
  <text x="80" y="124" font-family="ui-sans-serif, system-ui" font-size="14" fill="#9aa5ce">Hotel near BTS, ~1200 THB/night, pool, breakfast.</text>
  <text x="80" y="148" font-family="ui-sans-serif, system-ui" font-size="14" fill="#9aa5ce">Three nights before flying south to Phuket.</text>
  <text x="80" y="184" font-family="ui-sans-serif, system-ui" font-size="14" fill="#e0af68" font-weight="700">## Tips from Sasha</text>
  <text x="80" y="208" font-family="ui-sans-serif, system-ui" font-size="14" fill="#9aa5ce">- Take the airport rail, not a taxi from BKK.</text>
