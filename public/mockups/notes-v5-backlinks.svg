<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Pulse Notes v0.5.2 — wikilink autocomplete and tag autocomplete dropdowns">
  <title>Pulse Notes v0.5.2 — [[wikilink]] autocomplete and #tag autocomplete dropdowns</title>
  <defs>
    <linearGradient id="halo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0af68" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frameBorder2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4261"/>
      <stop offset="1" stop-color="#2f334d"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="popupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .frame-bg    { fill: #0d0e14; }
      .titlebar    { fill: #24283b; }
      .body-bg     { fill: #1a1b26; }
      .border      { stroke: #2f334d; stroke-width: 1; fill: none; }
      .border-faint{ stroke: #2f334d; stroke-width: 1; fill: none; opacity: 0.5; }
      .linenum     { fill: #565f89; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .editor-text { fill: #c0caf5; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .editor-mute { fill: #9aa5ce; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .h1          { fill: #bb9af7; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; font-weight: 700; }
      .h2          { fill: #7aa2f7; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; font-weight: 700; }
      .code        { fill: #9ece6a; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .link        { fill: #7dcfff; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .wikilink    { fill: #e0af68; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; font-weight: 600; }
      .tag         { fill: #ad8ee6; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px; }
      .cursor      { fill: #bb9af7; }
      .divider     { fill: #2f334d; }
      .pill        { fill: rgba(187,154,247,0.10); stroke: rgba(187,154,247,0.4); }
      .pill-tx     { fill: #bb9af7; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 600; }
      .pill-dot    { fill: #9ece6a; }
      .popup-bg    { fill: #24283b; stroke: #3b4261; }
      .popup-row-hover { fill: rgba(187,154,247,0.18); }
      .popup-row-tx { fill: #c0caf5; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 500; }
      .popup-row-meta { fill: #565f89; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
      .popup-hint-tx { fill: #8aa1c7; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
      .kbd { fill: #2a2f45; stroke: #3b4261; }
      .kbd-tx { fill: #bb9af7; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; }
      .label-tx   { fill: #bb9af7; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; }
      .helper-tx  { fill: #9aa5ce; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
      .divider-line { stroke: #2f334d; stroke-width: 1; }
    </style>
  </defs>

  <!-- Halo glow behind frame -->
  <rect x="40" y="40" width="1120" height="720" rx="20" fill="url(#halo2)"/>

  <!-- Window frame -->
  <g filter="url(#shadow2)">
    <rect x="60" y="60" width="1080" height="680" rx="14" class="frame-bg" stroke="url(#frameBorder2)"/>

    <!-- Title bar -->
    <rect x="60" y="60" width="1080" height="44" rx="14" class="titlebar"/>
    <rect x="60" y="92" width="1080" height="12" class="titlebar"/>
    <line x1="60" y1="104" x2="1140" y2="104" class="border"/>
    <circle cx="84" cy="82" r="6" fill="#f7768e"/>
    <circle cx="106" cy="82" r="6" fill="#e0af68"/>
    <circle cx="128" cy="82" r="6" fill="#9ece6a"/>
    <text x="160" y="86" class="editor-mute" font-size="12">Pulse Notes — Trip notes.md</text>
    <rect x="1024" y="71" width="92" height="22" rx="11" class="pill"/>
    <circle cx="1038" cy="82" r="3.5" class="pill-dot"/>
    <text x="1048" y="86" class="pill-tx">v0.5.2</text>

    <!-- Body -->
    <rect x="60" y="105" width="1080" height="585" class="body-bg"/>

    <!-- Editor with line numbers -->
    <rect x="60" y="105" width="44" height="585" fill="#16171f"/>
    <line x1="104" y1="105" x2="104" y2="690" class="border-faint"/>

    <!-- Editor content -->
    <g transform="translate(120, 130)">
      <text class="h1" x="0" y="0"># Trip notes</text>
      <text class="linenum" x="-50" y="0">1</text>
      <text class="editor-mute" x="0" y="22">Quick links to the other notes.</text>
      <text class="linenum" x="-50" y="22">2</text>
      <text x="0" y="44"> </text>
      <text class="linenum" x="-50" y="44">3</text>
      <text class="h2" x="0" y="66">## Hotels</text>
      <text class="linenum" x="-50" y="66">4</text>
      <text class="editor-text" x="0" y="88">Compare with <tspan class="wikilink">[[Bangk</tspan></text>
      <text class="linenum" x="-50" y="88">5</text>
      <text x="0" y="110"> </text>
      <text class="linenum" x="-50" y="110">6</text>
      <text class="h2" x="0" y="132">## People to ping</text>
      <text class="linenum" x="-50" y="132">7</text>
      <text class="editor-text" x="0" y="154">- <tspan class="wikilink">[[Pavel Pulse]]</tspan> about the visa</text>
      <text class="linenum" x="-50" y="154">8</text>
      <text class="editor-text" x="0" y="176">- <tspan class="wikilink">[[Maya itinerary draft]]</tspan></text>
      <text class="linenum" x="-50" y="176">9</text>
      <text x="0" y="198"> </text>
      <text class="linenum" x="-50" y="198">10</text>
      <text class="h2" x="0" y="220">## Tags</text>
      <text class="linenum" x="-50" y="220">11</text>
      <text class="editor-text" x="0" y="242"><tspan class="tag">#tr</tspan></text>
      <text class="linenum" x="-50" y="242">12</text>

      <!-- Caret right after the partial wikilink open -->
      <rect x="178" y="76" width="2" height="18" class="cursor"/>
      <!-- Caret right after the partial tag -->
      <rect x="22" y="230" width="2" height="18" class="cursor"/>
    </g>

    <!-- Status bar -->
    <rect x="60" y="690" width="1080" height="50" fill="#16171f"/>
    <line x1="60" y1="690" x2="1140" y2="690" class="border"/>
    <text x="80" y="720" class="editor-mute" font-size="11">Ln 5, Col 22 · Markdown</text>
    <text x="240" y="720" class="editor-mute" font-size="11">•</text>
    <text x="260" y="720" class="editor-mute" font-size="11">3 wikilinks open · fuzzy match active</text>
  </g>

  <!-- ─── Pop-up 1: [[wikilink]] autocomplete ──────────── -->
  <g filter="url(#popupShadow)">
    <rect x="332" y="208" width="440" height="232" rx="10" class="popup-bg"/>
    <!-- Header -->
    <rect x="332" y="208" width="440" height="34" rx="10" fill="#1f2335"/>
    <rect x="332" y="232" width="440" height="10" fill="#1f2335"/>
    <text x="350" y="230" class="label-tx">WIKILINK · TYPE [[ TO OPEN</text>
    <text x="754" y="230" text-anchor="end" class="popup-hint-tx">3 matches</text>

    <!-- Row 1: highlight (Bangkok hotel options) -->
    <rect x="332" y="242" width="440" height="44" class="popup-row-hover"/>
    <rect x="332" y="242" width="3" height="44" fill="#bb9af7"/>
    <text x="350" y="262" class="popup-row-tx" fill="#bb9af7">Bangkok hotel options</text>
    <text x="350" y="278" class="popup-row-meta">12 captures · 4 tags · 2026-07-15</text>
    <!-- match badge -->
    <rect x="700" y="252" width="48" height="20" rx="4" fill="rgba(187,154,247,0.2)"/>
    <text x="724" y="266" text-anchor="middle" class="popup-row-meta" fill="#bb9af7">match 1</text>

    <!-- Row 2 -->
    <rect x="332" y="286" width="440" height="44"/>
    <text x="350" y="306" class="popup-row-tx">Bangkok itinerary draft</text>
    <text x="350" y="322" class="popup-row-meta">8 captures · 3 tags · 2026-07-22</text>
    <rect x="700" y="296" width="48" height="20" rx="4" fill="rgba(187,154,247,0.1)"/>
    <text x="724" y="310" text-anchor="middle" class="popup-row-meta">match 2</text>

    <!-- Row 3 -->
    <rect x="332" y="330" width="440" height="44"/>
    <text x="350" y="350" class="popup-row-tx">Bangkok pad 1BR (Sukhumvit 11)</text>
    <text x="350" y="366" class="popup-row-meta">3 captures · 2 tags · 2026-07-28</text>
    <rect x="700" y="340" width="48" height="20" rx="4" fill="rgba(187,154,247,0.1)"/>
    <text x="724" y="354" text-anchor="middle" class="popup-row-meta">match 3</text>

    <!-- Footer hint -->
    <line x1="332" y1="396" x2="772" y2="396" class="divider-line"/>
    <rect x="332" y="396" width="440" height="44" rx="0" fill="#1f2335"/>
    <rect x="332" y="430" width="440" height="10" rx="0" fill="#1f2335"/>
    <rect x="332" y="430" width="440" height="10" rx="0" fill="#1f2335"/>
    <rect x="332" y="396" width="440" height="44" rx="0" fill="#1f2335"/>
    <text x="350" y="423" class="popup-hint-tx">
      <tspan class="kbd-tx">↑↓</tspan> navigate
      <tspan class="popup-hint-tx">  </tspan>
      <tspan class="kbd-tx">Enter</tspan> insert
      <tspan class="popup-hint-tx">  </tspan>
      <tspan class="kbd-tx">Esc</tspan> close
    </text>
    <text x="754" y="423" text-anchor="end" class="popup-hint-tx" fill="#9ece6a">+ create new note</text>
  </g>

  <!-- ─── Pop-up 2: #tag autocomplete ──────────────────── -->
  <g filter="url(#popupShadow)">
    <rect x="146" y="362" width="380" height="186" rx="10" class="popup-bg"/>
    <rect x="146" y="362" width="380" height="32" rx="10" fill="#1f2335"/>
    <rect x="146" y="384" width="380" height="10" fill="#1f2335"/>
    <text x="164" y="383" class="label-tx">TAG · TYPE # TO OPEN</text>
    <text x="508" y="383" text-anchor="end" class="popup-hint-tx">4 matches · ranked by use</text>

    <!-- Row 1: travel (most used) -->
    <rect x="146" y="394" width="380" height="36" class="popup-row-hover"/>
    <rect x="146" y="394" width="3" height="36" fill="#ad8ee6"/>
    <text x="164" y="416" class="popup-row-tx" fill="#ad8ee6">#travel</text>
    <text x="508" y="416" text-anchor="end" class="popup-row-meta">used 142× · last 2026-07-30</text>

    <!-- Row 2 -->
    <rect x="146" y="430" width="380" height="36"/>
    <text x="164" y="452" class="popup-row-tx">#trip-planning</text>
    <text x="508" y="452" text-anchor="end" class="popup-row-meta">used 23× · last 2026-07-29</text>

    <!-- Row 3 -->
    <rect x="146" y="466" width="380" height="36"/>
    <text x="164" y="488" class="popup-row-tx">#transit</text>
    <text x="508" y="488" text-anchor="end" class="popup-row-meta">used 9× · last 2026-07-12</text>

    <!-- Row 4 -->
    <rect x="146" y="502" width="380" height="36"/>
    <text x="164" y="524" class="popup-row-tx">#thailand</text>
    <text x="508" y="524" text-anchor="end" class="popup-row-meta">used 5× · last 2026-07-25</text>
  </g>

  <!-- ─── Annotation labels ──────────────────────────── -->
  <g>
    <!-- Arrow 1: from popup 1 to line 5 -->
    <path d="M 332,250 L 290,250 L 290,210" stroke="#bb9af7" stroke-width="1" fill="none" opacity="0.6"/>
    <text x="86" y="198" class="helper-tx" fill="#bb9af7">Type <tspan class="kbd-tx" font-weight="700">[[</tspan> and a fuzzy-match</text>
    <text x="86" y="214" class="helper-tx" fill="#bb9af7">dropdown opens over the cursor.</text>
  </g>
  <g>
    <!-- Arrow 2: from popup 2 to line 12 -->
    <path d="M 146,400 L 116,400" stroke="#ad8ee6" stroke-width="1" fill="none" opacity="0.6"/>
    <text x="546" y="396" class="helper-tx" fill="#ad8ee6">Type <tspan class="kbd-tx" font-weight="700">#</tspan> and existing tags surface,</text>
    <text x="546" y="412" class="helper-tx" fill="#ad8ee6">ranked by how often you actually use them.</text>
  </g>
</svg>
